[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rm65-servo-teleop"
version = "0.1.0"
description = "RM65 teleoperation adapters for ROS2 MoveIt Servo and ros2_control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "PyYAML"]

[project.optional-dependencies]
desktop = ["customtkinter==6.0.0"]
dev = ["pytest>=7,<10", "black>=24,<27", "ruff==0.11.13"]
vision = ["numpy==1.26.4; python_version < '3.13'", "pyrealsense2==2.58.1.10581"]

[tool.setuptools.packages.find]
where = ["ros2_ws/src/rm65_servo_teleop"]
include = ["rm65_servo_teleop*"]

[tool.pytest.ini_options]
testpaths = ["ros2_ws/src/rm65_servo_teleop/test", "tests_moveit"]
pythonpath = [".", "ros2_ws/src/rm65_servo_teleop"]
cache_dir = "build/cache/pytest"

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "/(build|docs/archive|ros2_ws/(build|install|log|vendor))/"

[tool.ruff]
target-version = "py310"
line-length = 120
cache-dir = "build/cache/ruff"
extend-exclude = ["docs/archive", "ros2_ws/build", "ros2_ws/install", "ros2_ws/log", "ros2_ws/vendor"]
extend-include = ["ros2_ws/src/rm65_servo_teleop/scripts/*"]

[tool.ruff.lint]
# Gate runtime errors without rewriting ROS imports, subscription lifetimes or style.
select = ["E9", "F63", "F7", "F82"]
