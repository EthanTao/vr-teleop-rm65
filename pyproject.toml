[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrobotoolkit_teleop"
version = "1.0.3"
description = "VR teleoperation for the side-mounted Realman RM65 using Placo and guarded Cartesian follow control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zhigen", email = "zhaozhigen@gmail.com"}
]
dependencies = [
    "numpy",
    "meshcat",
    "placo",
    "tyro",
    "h5py",
    "Robotic_Arm",
]

[project.optional-dependencies]
# Historical non-RM65 extras: retained for external installs; not required by the current RM65 entry.
hardware = [
    "ur_rtde",
    "dynamixel-sdk",
    "rospkg",
    "opencv-python",
    "pyrealsense2",
]
# Historical hand-retargeting extra; no current RM65 source imports it.
hand = [
    "torch",
    "dex_retargeting",
]
mac = [
    "pynput",
]
dev = [
    "black",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["xrobotoolkit_teleop*"]

[tool.setuptools.package-data]
xrobotoolkit_teleop = ["../assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120
