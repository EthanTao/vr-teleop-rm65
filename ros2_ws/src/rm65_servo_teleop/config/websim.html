<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>RM65 · PICO 连续跟随</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101925;color:#eef3fb;font:14px system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}canvas{display:block}
header{position:fixed;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:23px;margin:0 0 8px}small,footer{color:#9badc6}.tag{color:#83dcc4;border:1px solid #335d57;padding:9px 14px;border-radius:20px;background:#142a2a;height:38px}
.panel{position:fixed;left:28px;bottom:28px;width:320px;padding:20px;border:1px solid #354052;border-radius:15px;background:#17202eee}.line{display:flex;justify-content:space-between;margin:13px 0;color:#a8b7cb}.value{color:#eaf2ff;font-variant-numeric:tabular-nums}#state{font-size:18px;color:#83dcc4;margin:16px 0}#error{color:#ff9f87;font-size:12px;overflow-wrap:anywhere}footer{position:fixed;bottom:28px;right:28px;text-align:right;line-height:1.9}.legend{color:#bdc9db;line-height:1.9;margin-top:15px}
</style>
<header><div><h1>PICO → RM65 连续跟随</h1><small id="controller">MuJoCo 4.0 · 等待控制链</small></div><div class="tag">纯仿真 · 未连接机械臂</div></header>
<div class="panel"><div id="state">等待仿真状态…</div><div class="line"><span>手柄输入</span><span id="input" class="value">等待 PICO</span></div><div class="line"><span>仿真时间</span><span id="time" class="value">—</span></div><div class="line"><span>目标 / 实际误差</span><span id="err" class="value">—</span></div><div id="xyz" class="value">—</div><div class="legend"><span style="color:#ff8b54">●</span> 目标 TCP　<span style="color:#49d9ed">●</span> 实际 TCP<br>先松开右 Grip，再握住跟随；松开停止<br>页面只查看，运动输入来自 PICO 手柄</div><div id="error"></div></div>
<footer>左键旋转视角 · 滚轮缩放 · 右键平移<br>执行器参数为仿真假设，不代表真机性能</footer>
<script type="importmap">{"imports":{"three":"/static/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from '/static/OrbitControls.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#101925');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,30);camera.up.set(0,0,1);camera.position.set(1.3,-1.6,1.05);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,.45);controls.enableDamping=true;controls.minDistance=.35;controls.maxDistance=4;controls.update();
scene.add(new THREE.HemisphereLight(0xc4d9ff,0x303c4e,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(1,-2,3);scene.add(light);
const grid=new THREE.GridHelper(4,40,0x3b526e,0x23344b);grid.rotation.x=Math.PI/2;grid.position.z=-.023;scene.add(grid);
const objects=[];const marker=color=>new THREE.Mesh(new THREE.SphereGeometry(.009,20,14),new THREE.MeshBasicMaterial({color}));const actual=marker(0x49d9ed),goal=marker(0xff8b54);scene.add(actual,goal);goal.visible=false;
const reasons={released:'Grip 已松开',release_grip_to_start:'请先松开 Grip',tracking:'手柄正常',anchoring:'建立跟随起点',xr_timeout:'手柄数据中断',sdk_device_missing:'等待 PICO 连接',sdk_server_disconnected:'PICO 服务已断开',feedback_unavailable:'等待物理反馈',feedback_stale:'物理反馈过期',tcp_transform_unavailable:'等待末端坐标',controller_input_not_selected:'请选择 Controller 模式'};
try{
const model=await(await fetch('/model')).json();const meshes=model.meshes.map(v=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v.vertices.flat(),3));g.setIndex(v.faces.flat());g.computeVertexNormals();return g});
for(const geom of model.geoms){let geometry;if(geom.type===7)geometry=meshes[geom.mesh];else if(geom.type===0)geometry=new THREE.PlaneGeometry(4,4);else continue;const c=geom.rgba;const material=new THREE.MeshStandardMaterial({color:new THREE.Color(c[0],c[1],c[2]),roughness:.48,metalness:.12,side:THREE.DoubleSide});const mesh=new THREE.Mesh(geometry,material);mesh.matrixAutoUpdate=false;scene.add(mesh);objects.push({id:geom.id,mesh});}
async function update(){try{const s=await(await fetch('/state',{cache:'no-store'})).json();for(const {id,mesh} of objects){const p=s.geoms[id].p,r=s.geoms[id].r;mesh.matrix.set(r[0],r[1],r[2],p[0],r[3],r[4],r[5],p[1],r[6],r[7],r[8],p[2],0,0,0,1)}actual.position.fromArray(s.tcp_world);goal.visible=!!s.target_world;if(goal.visible)goal.position.fromArray(s.target_world);
document.getElementById('controller').textContent=(s.controller==='official'?'官方 IK':'MoveIt Servo / JTC')+' · MuJoCo '+s.engine;
document.getElementById('state').textContent=s.enabled?'正在连续跟随':'等待手柄 / Grip 已松开';document.getElementById('input').textContent=reasons[s.input_reason]||'输入未就绪';document.getElementById('time').textContent=s.time.toFixed(2)+' s';document.getElementById('xyz').textContent=s.tcp.map(x=>x.toFixed(4)).join('　')+' m';document.getElementById('err').textContent=s.error_m==null?'—':(s.error_m*1000).toFixed(2)+' mm';document.getElementById('error').textContent=['','released','accepted','grip_released','tracking','anchoring','release_grip_to_start'].includes(s.controller_reason||'')?'':('控制状态：'+s.controller_reason);
}catch(e){document.getElementById('state').textContent='仿真连接中断';document.getElementById('error').textContent=String(e)}setTimeout(update,40)}update();
}catch(e){document.getElementById('error').textContent=String(e)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera)}draw();
</script></html>
