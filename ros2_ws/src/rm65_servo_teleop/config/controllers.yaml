controller_manager:
  ros__parameters:
    # JTC must sample between Servo's 50 Hz single-point trajectory updates.
    # Its internal interpolation runs faster; the real-device bridge stays 50 Hz.
    update_rate: 250
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    rm65_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
rm65_arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Preserve the preceding JTC command when replacing each short trajectory.
    # Servo and the device guard continue to use measured feedback.
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.017453292519943295
      goal_time: 0.5
