name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Validate sources and run offline regression tests
        run: python -X utf8 scripts/tools/check_repository.py
      - name: Check shell syntax without executing scripts
        if: runner.os == 'Linux'
        shell: bash
        run: git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: build/test-results/
          if-no-files-found: ignore
